<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680">
  <defs>
    <style>
      .crystal-body { fill: #5b8dd9; }
      .crystal-face { fill: #7aaef5; }
      .crystal-dark { fill: #2d4fa3; }
      .crystal-light { fill: #afd0ff; }
      .crystal-inner { fill: #3a6bc9; }
    </style>
  </defs>
  <g transform="translate(340, 340)">
    <polygon class="crystal-dark" points="0,-220 -90,-60 0,-30 90,-60" />
    <polygon class="crystal-body" points="-90,-60 -160,80 0,200 0,-30" />
    <polygon class="crystal-face" points="90,-60 160,80 0,200 0,-30" />
    <polygon class="crystal-inner" points="-90,-60 0,-30 90,-60 0,20" />
    <polygon class="crystal-light" points="0,-220 -30,-100 0,-30 30,-100" />
    <polygon class="crystal-body" points="-90,-60 -50,-10 0,20 0,-30" opacity="0.6"/>
    <polygon class="crystal-face" points="90,-60 50,-10 0,20 0,-30" opacity="0.4"/>
    <line x1="-90" y1="-60" x2="0" y2="200" stroke="#2d4fa3" stroke-width="1" opacity="0.3"/>
    <line x1="90" y1="-60" x2="0" y2="200" stroke="#7aaef5" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
